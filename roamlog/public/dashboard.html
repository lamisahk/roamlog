<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoamLog — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --teal:       #0F6E56;
      --teal-light: #1D9E75;
      --teal-bg:    #E1F5EE;
      --teal-pale:  #F0FAF6;
      --amber:      #D97706;
      --amber-bg:   #FEF3C7;
      --amber-text: #92400E;
      --in-bg:      #D1FAE5;
      --in-text:    #065F46;
      --border:     #E4EDE9;
      --bg:         #F0F7F4;
      --card:       #ffffff;
      --text:       #111827;
      --muted:      #6B7280;
      --faint:      #F9FAFB;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 36px;
      height: 62px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: -0.4px;
    }
    .logo span { color: #9CA3AF; font-weight: 400; }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--teal-bg);
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.4px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--teal-light);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .spacer { flex: 1; }

    .clock {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .btn {
      background: var(--teal);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background .15s;
      font-family: inherit;
    }
    .btn:hover { background: #0D5E48; }
    .btn svg { width:14px; height:14px; }

    /* ── Main ── */
    .main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 30px 36px 48px;
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 22px 26px;
      border: 1px solid var(--border);
    }
    .stat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .stat-val {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-card.s-out  .stat-val { color: var(--amber); }
    .stat-card.s-in   .stat-val { color: var(--teal); }
    .stat-card.s-taps .stat-val { color: var(--text); }

    /* ── Two-column layout ── */
    .cols {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      align-items: start;
    }
    .section-heading {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    /* ── Student grid ── */
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .student-card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 11px;
      transition: border-color .15s;
    }
    .student-card:hover { border-color: #B5D4C8; }
    .student-card.is-out { border-left: 3px solid var(--amber); }
    .student-card.is-in  { border-left: 3px solid var(--teal-light); }

    .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--teal-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--teal);
      flex-shrink: 0;
    }
    .avatar.out { background: var(--amber-bg); color: var(--amber-text); }

    .s-info { flex: 1; min-width: 0; }
    .s-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .s-time { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 99px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .badge-out { background: var(--amber-bg); color: var(--amber-text); }
    .badge-in  { background: var(--in-bg);    color: var(--in-text); }

    /* ── Log panel ── */
    .log-panel {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .log-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .log-scroll {
      max-height: 440px;
      overflow-y: auto;
    }
    .log-scroll::-webkit-scrollbar { width: 4px; }
    .log-scroll::-webkit-scrollbar-track { background: transparent; }
    .log-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .log-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--faint);
      transition: background .1s;
    }
    .log-row:last-child { border-bottom: none; }
    .log-row:hover { background: var(--faint); }
    .log-row.new-entry { animation: slideIn .35s ease; }

    @keyframes slideIn {
      from { opacity:0; transform:translateY(-6px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .log-name { font-size: 13px; font-weight: 500; }
    .log-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ── Empty states ── */
    .empty {
      text-align: center;
      padding: 44px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .empty svg { margin-bottom: 10px; opacity: .35; }

    /* ── Connection banner ── */
    .banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 10px;
      z-index: 99;
    }
    .banner.show { display: block; }
  </style>
</head>
<body>

<header class="header">
  <span class="logo">Roam<span>Log</span></span>
  <div class="live-pill"><div class="dot"></div>LIVE</div>
  <div class="spacer"></div>
  <span class="clock" id="clock">--:--:--</span>
  <a class="btn" href="/api/export/csv" download>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 2v8M4 7l4 4 4-4M2 13h12"/>
    </svg>
    Export CSV
  </a>
</header>

<main class="main">
  <div class="stats">
    <div class="stat-card s-out">
      <div class="stat-label">Currently Out</div>
      <div class="stat-val" id="stat-out">—</div>
    </div>
    <div class="stat-card s-in">
      <div class="stat-label">Currently In</div>
      <div class="stat-val" id="stat-in">—</div>
    </div>
    <div class="stat-card s-taps">
      <div class="stat-label">Taps Today</div>
      <div class="stat-val" id="stat-today">—</div>
    </div>
  </div>

  <div class="cols">
    <div>
      <div class="section-heading">Student Status</div>
      <div class="student-grid" id="student-grid">
        <div class="empty" style="grid-column:1/-1">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg>
          <p>Waiting for first card tap…</p>
        </div>
      </div>
    </div>

    <div>
      <div class="section-heading">Recent Activity</div>
      <div class="log-panel">
        <div class="log-scroll" id="log-scroll">
          <div class="empty">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
            <p>No activity yet</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="banner" id="banner">⚠ Lost connection to server — retrying…</div>

<script>
  // ── Clock ──────────────────────────────────────────────────────────────────
  (function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-GB', { hour12: false });
    setTimeout(tick, 1000);
  })();

  // ── Helpers ────────────────────────────────────────────────────────────────
  function initials(n) {
    return n.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }
  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  let prevLogIds = new Set();

  // ── Render ─────────────────────────────────────────────────────────────────
  async function refresh() {
    try {
      const [stats, students, logs] = await Promise.all([
        fetch('/api/stats').then(r => r.json()),
        fetch('/api/students').then(r => r.json()),
        fetch('/api/logs?limit=40').then(r => r.json())
      ]);

      document.getElementById('banner').classList.remove('show');

      // Stats
      document.getElementById('stat-out').textContent   = stats.out;
      document.getElementById('stat-in').textContent    = stats.in;
      document.getElementById('stat-today').textContent = stats.today;

      // Students
      const grid = document.getElementById('student-grid');
      if (!students.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg>
          <p>Waiting for first card tap…</p></div>`;
      } else {
        grid.innerHTML = students.map(s => {
          const out = s.status === 'OUT';
          return `<div class="student-card ${out ? 'is-out' : 'is-in'}">
            <div class="avatar ${out ? 'out' : ''}">${initials(s.name)}</div>
            <div class="s-info">
              <div class="s-name">${s.name}</div>
              <div class="s-time">${s.lastSeen ? fmtTime(s.lastSeen) : ''}</div>
            </div>
            <span class="badge ${out ? 'badge-out' : 'badge-in'}">${s.status}</span>
          </div>`;
        }).join('');
      }

      // Log
      const scroll = document.getElementById('log-scroll');
      if (!logs.length) {
        scroll.innerHTML = `<div class="empty">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>
          <p>No activity yet</p></div>`;
      } else {
        scroll.innerHTML = logs.map(l => {
          const isNew = !prevLogIds.has(l.id);
          const out   = l.status === 'OUT';
          return `<div class="log-row${isNew ? ' new-entry' : ''}">
            <span class="log-name">${l.name}</span>
            <span class="badge ${out ? 'badge-out' : 'badge-in'}">${l.status}</span>
            <span class="log-time">${fmtTime(l.timestamp)}</span>
          </div>`;
        }).join('');
        prevLogIds = new Set(logs.map(l => l.id));
      }

    } catch {
      document.getElementById('banner').classList.add('show');
    }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
